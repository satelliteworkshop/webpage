<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schedule Display LUMITUULI</title>
<style>
html, body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 0px;
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

    .header {
    background: #38761D;
    height: 200px;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 0px;
    box-sizing: border-box;
 
     
 
  }

      h1 {
      margin-bottom: 40px;
      margin-top: 140px;
      color: white;
      font-size:78px;
    }
#footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 70px;

  background: #38761D;
  /* or a solid color like: background:#1d4ed8; */

  display: flex;
  align-items: center;
  justify-content: center;

 
}

#footerText {
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

#sheetFrame {
  width: 100%;
  height: 100%;
  border: 0;

  transform: scale(1);
  transform-origin: top left;

  /* compensate so it still fills the screen */
  width: 100%;

}

#clockBox {
  position: fixed;
  top: 50px;
  right: 50px;
  z-index: 9999;
  text-align: right;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background: rgba(0,0,0,0.6);
  padding: 10px 16px;
  border-radius: 12px;
}

#time {
  font-size: 78px;
  font-weight: 600;
  line-height: 1;
}

#date {
  font-size: 30px;
  opacity: 0.9;
}

</style>
</head>
<body>


    <div class="header">
    <a class="navbar-brand" href="../index.html"><img src="../assets/imgs/logo-light.png" alt="Logo" class="logo"></a>

     <h1>Lumituuli</h1>

    </div>
 

    <div id="clockBox">
  <div id="time"></div>
  <div id="date"></div>
</div>

<iframe id="sheetFrame"></iframe>

<script>
const SHEET_ID = "2PACX-1vQT5fvbLMcmPjOYlJK5rzJS10bUf2SN3YAF9yedVOTebuiJadiH3mcJzDuIgsx__bL-DLe5GfS_tjsV";
const GID = "0";

/*
  Configure your 3 literal dates here (YYYY-MM-DD), each with morning + afternoon ranges.
  Also configure a DEFAULT range pair used on all other dates.
*/
const DATE_RANGES = {
  "2026-01-20": { morning: "E3:J19",  afternoon: "E19:J37" },
  "2026-01-21": { morning: "K3:P19", afternoon: "K19:P37" },
  "2026-01-16": { morning: "Q3:V19", afternoon: "Q19:V37" }
};

// Shown when today is NOT one of the three dates above:
const DEFAULT_RANGES = { morning: "E3:J19", afternoon: "E19:J33" };

// Morning vs afternoon boundary
function getTimeBlock(now) {
  const h = now.getHours();
  const m = now.getMinutes();
  return (h > 12 || (h === 11 && m >= 20)) ? "afternoon" : "morning";
}

// YYYY-MM-DD in local time
function ymd(now) {
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function getRangeForNow() {
  const now = new Date();
  const dateKey = ymd(now);
  const timeBlock = getTimeBlock(now);

  const rangesForToday = DATE_RANGES[dateKey] || DEFAULT_RANGES;
  return rangesForToday[timeBlock];
}

function buildUrl() {
  const range = getRangeForNow();
  return `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pubhtml?gid=${GID}&single=true&range=${range}&headers=false`;
}

function loadSheet() {
  const iframe = document.getElementById("sheetFrame");
  if (iframe) iframe.src = buildUrl();
}

// initial load
loadSheet();

// refresh every 10 minutes
setInterval(loadSheet, 10 * 60 * 1000);

// reload exactly at 12:30 and midnight (boundary changes)
function scheduleBoundaryReload() {
  const now = new Date();
  const next = new Date(now);

  if (now.getHours() < 12 || (now.getHours() === 12 && now.getMinutes() < 30)) {
    next.setHours(12, 30, 0, 0); // today 12:30
  } else {
    next.setHours(24, 0, 0, 0); // midnight
  }

  setTimeout(() => {
    loadSheet();
    scheduleBoundaryReload();
  }, next - now);
}
scheduleBoundaryReload();

// clock/date overlay (optional: requires elements with ids "time" and "date")
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const date = now.toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" });

  const t = document.getElementById("time");
  const d = document.getElementById("date");
  if (t) t.textContent = time;
  if (d) d.textContent = date;
}
updateClock();
setInterval(updateClock, 60000); // every minute
</script>


<div id="footer">
  <div id="footerText">Today’s schedule • Welcome</div>
</div>
</body>
</html>
